name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn install --immutable

      # ESLint also runs inside `yarn build`, but keeping it here means a lint
      # failure is reported as a lint failure rather than as a broken build.
      - name: ESLint
        run: yarn lint

      # The reason this workflow exists. @rollup/plugin-typescript reports type
      # errors as warnings and still emits a bundle, so `yarn build` returns 0
      # on code that does not type-check - a broken type would reach a release
      # unnoticed. This is the only gate that actually fails on one.
      - name: Type check
        run: yarn typecheck

      # The README is the card's HACS landing page, not just developer docs.
      - name: Markdown
        run: yarn lint:md

      - name: Formatting
        run: yarn lint:format

      # hacs.json declares the minimum Home Assistant version and HACS enforces
      # it; the README and ARCHITECTURE only describe it. This catches the day
      # those stop agreeing.
      - name: Home Assistant version sync
        run: yarn ha-version-sync

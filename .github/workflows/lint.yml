name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn install --immutable

      # ESLint also runs inside `yarn build`, but keeping it here means a lint
      # failure is reported as a lint failure rather than as a broken build.
      - name: ESLint
        run: yarn lint

      # The reason this workflow exists. @rollup/plugin-typescript reports type
      # errors as warnings and still emits a bundle, so `yarn build` returns 0
      # on code that does not type-check - a broken type would reach a release
      # unnoticed. This is the only gate that actually fails on one.
      - name: Type check
        run: yarn typecheck

      # The README is the card's HACS landing page, not just developer docs.
      - name: Markdown
        run: yarn lint:md

      - name: Formatting
        run: yarn lint:format
